name: Gamedev CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Codebase Health, Tests & Soak Run
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm test

      - name: Generate Placeholder Assets Smoke Test
        run: pnpm run assets:placeholders

      - name: Run Soak Testing (Memory & Crash Check)
        run: |
          chmod +x scripts/soak-test.sh
          bash scripts/soak-test.sh --duration 10 --cmd "node -e 'setTimeout(()=>{}, 20000)'"

  build-web:
    name: WebAssembly Build & Package
    needs: audit-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Package
        run: |
          chmod +x scripts/build-web.sh
          pnpm run build:web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: game-web-dist
          path: dist/web/

  deploy-pages:
    name: Deploy Web Build to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This repository may or may not have GitHub Pages configured. Without it,
      # configure-pages fails with "Get Pages site failed" and turns every push to
      # main red for a publish target nobody asked for. Probe first, publish only
      # when Pages is actually enabled; otherwise the job skips and stays green.
      - name: Check GitHub Pages availability
        id: pages_probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Web deploy skipped"
              echo ""
              echo "GitHub Pages is not enabled for this repository, so there is no"
              echo "publish target. Enable Pages (Settings -> Pages -> Source: GitHub"
              echo "Actions) and this job will deploy the starter build again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download Web Artifact
        if: steps.pages_probe.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: game-web-dist
          path: dist/web/

      - name: Setup Pages
        if: steps.pages_probe.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Artifact to Pages
        if: steps.pages_probe.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web/

      - name: Deploy to GitHub Pages
        if: steps.pages_probe.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

name: Validate

on:
  push:
    branches: [main, master]
  # No base-branch filter: a stacked pull request targets another feature
  # branch, and filtering by base left those with no CI at all.
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # The hooks ship to users and jest runs with --experimental-strip-types,
      # which erases types without checking them. This step is the only thing that
      # verifies them, so it must fail the job when it fails.
      - name: Type-check the hooks extension
        run: pnpm exec tsc -p extensions/hooks/tsconfig.json --noEmit

      - name: Validate package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            assert(pkg.keywords.includes('pi-package'), 'missing pi-package keyword');
            assert(pkg.pi?.skills, 'missing pi.skills');
            assert(!pkg.pi?.prompts, 'pi.prompts must stay retired (odd/tasks/retire-prompts-layer.md)');
            assert(pkg.pi?.extensions, 'missing pi.extensions');
            console.log('✅ package.json valid');
            function assert(condition, msg) { if (!condition) { console.error('❌', msg); process.exit(1); } }
          "

      - name: Validate agent frontmatter
        run: |
          for f in agents/*.md; do
            name=$(basename "$f" .md)
            if ! head -20 "$f" | grep -q 'model: inherit'; then
              echo "❌ $name missing model: inherit"
              exit 1
            fi
            if head -20 "$f" | grep -qE 'model: (opus|sonnet|haiku)'; then
              echo "❌ $name has Claude model residual"
              exit 1
            fi
            echo "✅ $name"
          done
          echo "All $(( $(ls agents/*.md | wc -l) )) agents valid"

      - name: Validate skill SKILL.md files
        run: |
          for d in skills/*/; do
            [[ "$d" == *"test-results"* || "$d" == *"test-rubrics"* ]] && continue
            skill=$(basename "$d")
            [[ "$skill" == _* ]] && continue
            if [ ! -f "${d}SKILL.md" ]; then
              echo "❌ $skill missing SKILL.md"
              exit 1
            fi
            if head -20 "${d}SKILL.md" | grep -qE 'model: (opus|sonnet|haiku)'; then
              echo "❌ $skill has Claude model residual"
              exit 1
            fi
            echo "✅ $skill"
          done
          echo "All $( ls -d skills/*/ | grep -v '/_' | wc -l | tr -d ' ' ) skills valid"

      - name: Validate assign-models.js
        run: |
          output=$(node scripts/assign-models.js --dry-run --tier '{
            "director": "anthropic/claude-sonnet-4",
            "workhorse": "openai/gpt-4o",
            "lightweight": "ollama/llama3.2"
          }' 2>&1)
          echo "$output"
          echo "$output" | grep -q "Summary:" || { echo "❌ assign-models.js produced no summary"; exit 1; }
          echo "✅ assign-models.js runs clean"

      - name: Validate models.default.json
        run: |
          node -e "
            const m = require('./models.default.json');
            const keys = Object.keys(m);
            if (keys.length < 3) { console.error('❌ too few keys'); process.exit(1); }
            console.log('✅ models.default.json with keys:', keys.join(', '));
          "


      - name: Check file count consistency
        run: |
          AGENTS=$(ls -1 agents/*.md | wc -l | tr -d ' ')
          SKILLS=$(ls -d skills/*/ | wc -l | tr -d ' ')
          PROMPTS=$(find prompts -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "📊 Agents: $AGENTS | Skills: $SKILLS | Templates: $PROMPTS"
          [ "$AGENTS" = "15" ] || { echo "❌ Expected 15 agents (8 core + 6 engine specialists + 1 read-only verifier), got $AGENTS"; exit 1; }
          [ "$PROMPTS" = "0" ] || { echo "❌ Expected 0 templates (layer retired), got $PROMPTS"; exit 1; }

name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate package.json and Gentle Shell normative skills
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const assert = require("assert");

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            assert(pkg.keywords.includes("pi-package"), "missing pi-package keyword");
            assert(Array.isArray(pkg.pi?.skills) && pkg.pi.skills.includes("./skills"), "missing pi.skills");
            assert(!pkg.pi?.extensions, "extensions must stay retired");
            assert(!pkg.pi?.prompts, "prompts must stay retired");

            const expected = [
              "gamedev-bevy",
              "gamedev-core",
              "gamedev-godot",
              "gamedev-phaser",
              "gamedev-raylib",
              "gamedev-unity",
              "gamedev-unreal"
            ];
            const dirs = fs.readdirSync("skills").sort();
            assert.deepStrictEqual(dirs, expected, "skill directory mismatch");

            const requiredSections = [
              "## Activation Contract",
              "## Hard Rules",
              "## Decision Gates",
              "## Execution Steps",
              "## Output Contract"
            ];

            for (const dir of dirs) {
              const skillPath = path.join("skills", dir, "SKILL.md");
              assert(fs.existsSync(skillPath), "missing " + skillPath);
              const content = fs.readFileSync(skillPath, "utf8");
              const match = content.match(/^---\nname:\s*(\S+)\ndescription:\s*"(Trigger:[^"]+)"\nlicense:\s*MIT\nmetadata:\n\s+author:\s*\S+\n\s+version:\s*"[^"]+"\n---/);
              assert(match && match[1] === dir, "invalid frontmatter in " + skillPath);

              let lastIdx = -1;
              for (const sec of requiredSections) {
                const idx = content.indexOf(sec);
                assert(idx > lastIdx, "missing or out-of-order section " + sec + " in " + skillPath);
                lastIdx = idx;
              }
            }
            console.log("All 7 Gentle Shell normative gamedev skills validated.");
          '

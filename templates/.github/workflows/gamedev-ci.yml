name: Gamedev CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Codebase Health, Tests & Soak Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Generate Placeholder Assets Smoke Test
        run: npm run assets:placeholders

      - name: Run 60s Soak Testing (Memory & Crash Check)
        run: |
          chmod +x scripts/soak-test.sh
          npm run test:soak -- --duration 10 --cmd "node -e 'console.log(\"CI Smoke runner OK\")'"

  build-web:
    name: WebAssembly Build & Package
    needs: audit-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Package
        run: |
          chmod +x scripts/build-web.sh
          npm run build:web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-web-dist
          path: dist/web/

  deploy-pages:
    name: Deploy Web Build to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: game-web-dist
          path: dist/web/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
